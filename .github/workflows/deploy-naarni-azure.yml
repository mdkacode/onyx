# ============================================================================
# Naarni — Build, Push to Docker Hub, Deploy to Azure VM
# ============================================================================
# Flow:
#   1. Push to main → triggers this workflow
#   2. Build 3 Docker images from your code
#   3. Push to Docker Hub (naarnimd/naarni-ai-*)
#   4. SSH into Azure VM → pull images → inject secrets → restart
#
# All credentials come from GitHub Secrets — never committed to code.
#
# GitHub Secrets required:
#   DOCKERHUB_USERNAME        — Docker Hub username (naarnimd)
#   DOCKERHUB_TOKEN           — Docker Hub access token
#   VM_HOST                   — Azure VM public IP
#   VM_USER                   — SSH username (naarni)
#   VM_SSH_KEY                — SSH private key
#   OAUTH_CLIENT_ID           — Azure AD app client ID
#   OAUTH_CLIENT_SECRET       — Azure AD app client secret
#   USER_AUTH_SECRET           — OIDC state token signing key
#   POSTGRES_PASSWORD          — Database password
#   AZURE_STORAGE_ACCOUNT_KEY  — key for storage account naarnionyxfilestore
#                                (REQUIRED — the file store runs on Azure Blob)
#   S3_AWS_ACCESS_KEY_ID       — AWS S3 access key (legacy, rollback only)
#   S3_AWS_SECRET_ACCESS_KEY   — AWS S3 secret key (legacy, rollback only)
# ============================================================================

name: NaArNi Gyan - Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Phase 1: Build and push Docker images to Docker Hub
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # ratchet:docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # ratchet:docker/setup-buildx-action@v4

      - name: Build & Push Backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # ratchet:docker/build-push-action@v6
        with:
          context: backend/
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_ORG }}/naarni-ai-backend:${{ github.sha }}
            ${{ env.DOCKERHUB_ORG }}/naarni-ai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # ratchet:docker/build-push-action@v6
        with:
          context: web/
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_ORG }}/naarni-ai-web:${{ github.sha }}
            ${{ env.DOCKERHUB_ORG }}/naarni-ai-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Model Server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # ratchet:docker/build-push-action@v6
        with:
          context: backend/
          file: backend/Dockerfile.model_server
          push: true
          tags: |
            ${{ env.DOCKERHUB_ORG }}/naarni-ai-model-server:${{ github.sha }}
            ${{ env.DOCKERHUB_ORG }}/naarni-ai-model-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # Phase 2: Deploy to Azure VM
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code (for config files)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: Copy deployment configs to VM
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # ratchet:appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "deployment/docker_compose/docker-compose.prod.yml,deployment/docker_compose/docker-compose.naarni.yml,deployment/docker_compose/.env.naarni-azure,deployment/docker_compose/.env.nginx.naarni,deployment/data/"
          target: /opt/naarni/
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # ratchet:appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # pipefail is critical: the migration/up commands pipe to `tail`, and
            # without it a failed `docker compose` (e.g. invalid compose project)
            # is masked by tail's exit 0 and the deploy falsely reports success.
            set -eo pipefail
            cd /opt/naarni/deployment/docker_compose

            # ── Build .env: merge config + secrets ──
            # IMPORTANT: Never use 'down -v' or remove volumes — data must persist
            cp .env.naarni-azure .env
            cp .env.nginx.naarni .env.nginx
            # S3_* are unused now that FILE_STORE_BACKEND=azure, but stay
            # injected so a rollback is a one-line edit to .env.naarni-azure
            # rather than a secrets round-trip. The old bucket is still intact.
            cat >> .env <<'SECRETS_EOF'
            OAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}
            OAUTH_CLIENT_SECRET=${{ secrets.OAUTH_CLIENT_SECRET }}
            USER_AUTH_SECRET=${{ secrets.USER_AUTH_SECRET }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
            S3_AWS_ACCESS_KEY_ID=${{ secrets.S3_AWS_ACCESS_KEY_ID }}
            S3_AWS_SECRET_ACCESS_KEY=${{ secrets.S3_AWS_SECRET_ACCESS_KEY }}
            SECRETS_EOF

            # ── Pull new images only (NO restart yet) ──
            echo "=== Pulling images ==="
            docker compose -f docker-compose.prod.yml -f docker-compose.naarni.yml pull api_server web_server background 2>&1 | tail -5

            # ── Step 0: Start OpenSearch (new search backend; replaces Vespa) ──
            # OpenSearch is a new service on this host. Bring it up (pulls image if
            # needed) and wait until it responds before migrations / app start.
            # The opensearch image ships curl; a 401 still means it's up, and
            # `curl -sk` exits 0 on any HTTP response.
            echo "=== Starting OpenSearch ==="
            docker compose -f docker-compose.prod.yml -f docker-compose.naarni.yml up -d --no-deps opensearch 2>&1 | tail -5
            echo "Waiting for OpenSearch to respond..."
            os_ready=0
            for i in $(seq 1 36); do
              if docker exec onyx-opensearch-1 curl -sk https://localhost:9200 >/dev/null 2>&1 \
                 || docker exec onyx-opensearch-1 curl -sf http://localhost:9200 >/dev/null 2>&1; then
                echo "  OpenSearch responding after ${i}0s"; os_ready=1; break
              fi
              sleep 10
            done
            if [ "$os_ready" -ne 1 ]; then
              echo "ERROR: OpenSearch did not become ready — aborting before app restart."
              docker logs onyx-opensearch-1 --tail 40 2>&1 || true
              exit 1
            fi

            # ── Safe rolling restart: NEVER touch DB/Redis/OpenSearch volumes ──
            # Infrastructure (DB, Redis, OpenSearch) data volumes stay untouched.
            echo "=== Restarting app containers only (DB/Redis/OpenSearch data untouched) ==="

            # Step 1a-pre: Back up the database BEFORE migrating (data-safety gate).
            # Migrations never run without a verified restore point. pg_dump uses
            # custom format (-Fc, compressed + restorable via pg_restore). Aborts the
            # whole deploy if the dump is missing or implausibly small.
            echo "=== Backing up database before migration ==="
            mkdir -p /opt/naarni/backups
            BACKUP_FILE="/opt/naarni/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).dump"
            docker exec onyx-relational_db-1 pg_dump -U postgres -Fc postgres > "$BACKUP_FILE"
            BACKUP_SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || echo 0)
            echo "Backup written: $BACKUP_FILE ($BACKUP_SIZE bytes)"
            if [ "$BACKUP_SIZE" -lt 50000 ]; then
              echo "ERROR: backup missing or too small ($BACKUP_SIZE bytes) — aborting deploy BEFORE migrations."
              exit 1
            fi
            # Retain only the 10 most recent pre-deploy backups
            ls -1t /opt/naarni/backups/pre-deploy-*.dump 2>/dev/null | tail -n +11 | xargs -r rm -f

            # Step 1a: Run Alembic migrations before starting the new API server
            echo "=== Running database migrations ==="
            docker compose -f docker-compose.prod.yml -f docker-compose.naarni.yml run --rm --no-deps \
              -e PYTHONPATH=/app \
              api_server alembic upgrade head 2>&1 | tail -10
            echo "Migrations complete."

            # Step 1b: Start API server
            docker compose -f docker-compose.prod.yml -f docker-compose.naarni.yml up -d --no-deps --force-recreate api_server 2>&1 | tail -3

            # Wait for API to be healthy
            echo "Waiting for API..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "  API healthy after ${i}0s"
                break
              fi
              sleep 10
            done

            # Step 2: Background workers
            docker compose -f docker-compose.prod.yml -f docker-compose.naarni.yml up -d --no-deps --force-recreate background 2>&1 | tail -3

            # Step 3: Web server
            docker compose -f docker-compose.prod.yml -f docker-compose.naarni.yml up -d --no-deps --force-recreate web_server 2>&1 | tail -3
            sleep 5

            # Step 4: Reload nginx (no recreate — just signal reload)
            docker exec onyx-nginx-1 nginx -s reload 2>/dev/null || \
              docker restart onyx-nginx-1 2>/dev/null

            echo ""
            echo "=== Status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | sort
            echo ""
            free -h | head -3
            echo ""
            echo "Deploy complete: $(date)"

  # ──────────────────────────────────────────────────────────────────────────
  # Phase 3: Health check
  # ──────────────────────────────────────────────────────────────────────────
  health-check:
    name: Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for services to stabilize
        run: sleep 45

      - name: Health check
        run: |
          echo "Checking https://ai.naarni.com/api/health ..."
          for i in $(seq 1 15); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "https://ai.naarni.com/api/health" || echo "000")
            echo "  Attempt $i/15: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo ""
              echo "API is healthy!"
              curl -sk -o /dev/null -w "Frontend: HTTP %{http_code}\n" "https://ai.naarni.com"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: API not healthy after 2.5 minutes"
          exit 1
